name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - run: 'python -m pip install --only-binary=:all: -r optional/ecovacs/requirements.txt'
      - run: npm ci --ignore-scripts
      # Core installation has no mandatory vendor dependency. The complete test
      # matrix explicitly selects the reviewed LG transport and Python worker.
      - run: npm run adapter:lg:install
      - run: npm test
      - run: python -I -B optional/ecovacs/test_worker.py
      - run: npm run check:profiles
      - run: npm run check:package
      - run: npm run check:public
